services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bayarea_tech_jobs_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./sql:/workspace/sql:ro
      - ./data/processed:/workspace/data/processed:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bayarea_tech_jobs_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  notebook:
    build: .
    working_dir: /workspace
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bayarea_tech_jobs_db}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-bayarea_tech_jobs_db}
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
